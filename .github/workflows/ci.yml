name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: フロントエンドのビルド
        run: npm run build:web

      - name: テスト (Worker 結合 + 暗号)
        run: npm test

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>CryptBox — 端末内で暗号化する大容量ファイル転送</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>"
    />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark">🔐</span>
        <span class="brand-name">CryptBox</span>
      </a>
      <p class="tagline">鍵はブラウザから出ません</p>
    </header>

    <main id="app">
      <!-- ================= アップロード ================= -->
      <section id="view-upload" hidden>
        <div id="dropzone" class="dropzone">
          <input id="file-input" type="file" hidden />
          <p class="dropzone-title">ファイルをドロップ</p>
          <p class="dropzone-sub">またはクリックして選択（最大 100 GiB）</p>
        </div>

        <div id="upload-form" hidden>
          <div class="file-card">
            <div class="file-name" id="selected-name"></div>
            <div class="file-size" id="selected-size"></div>
            <button type="button" id="clear-file" class="link-button">選び直す</button>
          </div>

          <div class="options">
            <label class="field">
              <span class="field-label">有効期限</span>
              <select id="expiry"></select>
            </label>

            <label class="field">
              <span class="field-label">ダウンロード回数</span>
              <select id="max-downloads">
                <option value="1">1 回</option>
                <option value="5">5 回</option>
                <option value="20">20 回</option>
                <option value="100">100 回</option>
                <option value="">無制限</option>
              </select>
            </label>

            <label class="field field-wide">
              <span class="field-label">パスワード（任意・Argon2id で鍵導出）</span>
              <input id="password" type="password" autocomplete="new-password" placeholder="設定しない場合は空欄" />
            </label>
          </div>

          <button id="start-upload" class="primary">暗号化してアップロード</button>
        </div>

        <div id="upload-progress" hidden>
          <p class="progress-label" id="upload-stage">準備中…</p>
          <div class="progress"><div class="progress-bar" id="upload-bar"></div></div>
          <p class="progress-detail" id="upload-detail"></p>
          <button id="cancel-upload" class="link-button">中止する</button>
        </div>

        <div id="upload-result" hidden>
          <h2>共有リンクができました</h2>
          <p class="hint">
            <code>#</code> より後ろが復号鍵です。サーバーには送信されないため、このリンクを失うと誰も復元できません。
          </p>
          <div class="share-row">
            <input id="share-url" type="text" readonly />
            <button id="copy-url" class="primary">コピー</button>
          </div>
          <dl class="summary" id="result-summary"></dl>
          <button id="upload-another" class="link-button">別のファイルを送る</button>
        </div>
      </section>

      <!-- ================= ダウンロード ================= -->
      <section id="view-download" hidden>
        <div id="download-loading" class="centered">
          <div class="spinner"></div>
          <p>ファイル情報を取得しています…</p>
        </div>

        <div id="download-card" hidden>
          <h2 id="download-name" class="file-name"></h2>
          <dl class="summary" id="download-summary"></dl>

          <label class="field field-wide" id="password-field" hidden>
            <span class="field-label">パスワード</span>
            <input id="download-password" type="password" autocomplete="current-password" />
          </label>

          <button id="start-download" class="primary">復号してダウンロード</button>
        </div>

        <div id="download-progress" hidden>
          <p class="progress-label" id="download-stage">ダウンロード中…</p>
          <div class="progress"><div class="progress-bar" id="download-bar"></div></div>
          <p class="progress-detail" id="download-detail"></p>
          <p class="hint" id="save-method"></p>
        </div>

        <div id="download-done" hidden class="centered">
          <p class="done-mark">✓</p>
          <p>復号が完了しました。保存先を確認してください。</p>
        </div>
      </section>

      <div id="error" class="error" hidden></div>
    </main>

    <footer class="site-footer">
      <ul>
        <li>TLS 1.3 のみ</li>
        <li>AES-256-GCM（端末内で暗号化）</li>
        <li>Argon2id（m=64MiB, t=3, p=1）</li>
        <li>再エンコードなし＝劣化ゼロ</li>
      </ul>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
